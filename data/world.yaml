world:
  locations:
    destiny_islands:
      name: "Destiny Islands"
      description: "A beautiful tropical island where journeys begin. The sun is shining brightly."
      exits:
        east: "traverse_town"
        south: "hollow_bastion"
        north: "secret_cave"
      spawns:
        - npc_type: "yen_sid"
          count: 1
      items: ["potion"]

    secret_cave:
      name: "Secret Cave"
      description: "A dark, hidden cave where strange drawings line the walls."
      exits:
        south: "destiny_islands"

    traverse_town:
      name: "Traverse Town"
      description: "A quiet town under a starry night sky. A refuge for those who have lost their worlds."
      exits:
        west: "destiny_islands"
        east: "wonderland"
      spawns:
        - npc_type: "leon"
          count: 1
      items: ["keyblade"]

    wonderland:
      name: "Wonderland"
      description: "A bizarre and nonsensical world filled with oddities and peculiar characters."
      exits:
        west: "traverse_town"
        south: "olympus_coliseum"

    olympus_coliseum:
      name: "Olympus Coliseum"
      description: "A grand arena where heroes test their might in fierce tournaments."
      exits:
        north: "wonderland"
        south: "agrabah"
      spawns:
        - npc_type: "large_body"
          count: 1
        - npc_type: "sephiroth"
          count: 1

    agrabah:
      name: "Agrabah"
      description: "A desert city full of mysteries, bustling streets, and hidden treasures."
      exits:
        north: "olympus_coliseum"
        west: "halloween_town"
      items: ["ether"]

    halloween_town:
      name: "Halloween Town"
      description: "A spooky world where every day is Halloween. Ghosts and goblins roam the streets."
      exits:
        east: "agrabah"
        west: "neverland"

    neverland:
      name: "Neverland"
      description: "A magical pirate ship flying through the night sky. You can almost fly!"
      exits:
        east: "halloween_town"
        north: "hollow_bastion"
      items: ["wayfinder"]

    hollow_bastion:
      name: "Hollow Bastion"
      description: "A majestic yet decaying castle suspended over a void, steeped in dark magic."
      exits:
        south: "neverland"
        north: "destiny_islands"
      spawns:
        - npc_type: "shadow_heartless"
          count: 2

  npcs:
    yen_sid:
      name: "Master Yen Sid"
      role: "quest_giver"
      description: "A wise and powerful sorcerer, retired Keyblade Master."
      dialogue: ["Welcome, young one.", "The worlds are in peril. I have a task for you."]
      quests: ["find_wayfinder", "defeat_shadow"]
    leon:
      name: "Leon"
      role: "dialogue"
      description: "A stoic warrior wielding a gunblade. He seems to know a lot about the Heartless."
      dialogue: ["The Heartless are drawn to the darkness in people's hearts.", "Stay sharp out there."]
    shadow_heartless:
      name: "Shadow"
      role: "enemy"
      description: "A pureblood Heartless born from the darkness in a heart. It twitches erratically."
      stats:
        hp: 30
        damage: 10
    large_body:
      name: "Large Body"
      role: "enemy"
      description: "A massive Heartless that blocks attacks with its big belly."
      stats:
        hp: 100
        damage: 25
    sephiroth:
      name: "Sephiroth"
      role: "enemy"
      description: "A legendary SOLDIER with a massive nodachi. One-Winged Angel plays ominously in the background..."
      stats:
        hp: 9999
        damage: 9999

  items:
    potion:
      name: "Potion"
      description: "A restorative item that heals a small amount of HP."
      obtainable: true
    ether:
      name: "Ether"
      description: "An item that restores magic power."
      obtainable: true
    keyblade:
      name: "Kingdom Key"
      description: "A mysterious weapon shaped like a giant key. It holds immense power."
      obtainable: true
    wayfinder:
      name: "Wayfinder"
      description: "A star-shaped charm made of thalassa shells. It binds friends together."
      obtainable: true

  quests:
    find_wayfinder:
      name: "Bonds of Friendship"
      description: "Find a Wayfinder and show it to Yen Sid."
      type: "fetch"
      target: "wayfinder"
      reward: "You feel your heart grow stronger."
    defeat_shadow:
      name: "Push Back the Darkness"
      description: "Defeat a Shadow Heartless."
      type: "defeat"
      target: "shadow_heartless"
      reward: "You gained valuable combat experience."
